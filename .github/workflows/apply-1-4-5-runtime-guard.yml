name: Apply LocalTube 1.4.5 runtime guard

on:
  push:
    branches:
      - fix/macos-active-runtime-1.4.5

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: defer runtime replacement for unmanaged processes (1.4.5)' }}"
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation and regression guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_1_4_5_runtime_guard.py
          /bin/bash -n installer/install.sh
          /bin/bash --version | head -n 1
          python3 scripts/check_installer_runtime_deferral.py
          python3 scripts/check_shell_compat.py
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/VERSION app/server.ts installer/install.sh installer/install-windows.ps1 scripts/test.sh scripts/check_installer_runtime_deferral.py CHANGELOG.md
          git commit -m 'fix: defer runtime replacement for unmanaged processes (1.4.5)'
          git push origin HEAD:fix/macos-active-runtime-1.4.5
