name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static + package build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript compiler
        run: npm install --global typescript@5.8.3
      - name: Full source and package audit
        shell: bash
        run: ./scripts/test.sh
      - name: Upload bootstrap packages
        uses: actions/upload-artifact@v4
        with:
          name: LocalTube-bootstrap-packages
          path: |
            dist/LocalTube-macOS-v*.zip
            dist/LocalTube-macOS-v*.zip.sha256
            dist/LocalTube-Linux-v*.tar.gz
            dist/LocalTube-Linux-v*.tar.gz.sha256
            dist/LocalTube-Windows-v*.zip
            dist/LocalTube-Windows-v*.zip.sha256
          if-no-files-found: error

  linux-integration:
    name: Linux runtime + backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Real Linux integration
        shell: bash
        run: ./scripts/ci_linux_integration.sh

  windows-integration:
    name: Windows runtime + backend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax + installer layout + real Windows integration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'INSTALL.ps1',
            'installer/install-windows.ps1',
            'app/scripts/runtime_windows.ps1',
            'app/scripts/run_server.ps1',
            'scripts/ci_windows_integration.ps1'
          ) + (Get-ChildItem 'control/windows/*.ps1' | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          }
          .\INSTALL.ps1 -SelfTest
          .\scripts\ci_windows_integration.ps1

  macos-integration:
    name: macOS runtime + YouTube E2E
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global typescript@5.8.3
      - name: Source/package audit on macOS
        shell: bash
        run: ./scripts/test.sh
      - name: Real macOS integration
        shell: bash
        run: ./scripts/ci_macos_integration.sh
      - name: Upload macOS bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: LocalTube-macOS-bootstrap
          path: |
            dist/LocalTube-macOS-v*.zip
            dist/LocalTube-macOS-v*.zip.sha256
          if-no-files-found: error

  macos-intel-integration:
    name: macOS Intel installer + resilient loopback
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Intel-specific installer guards and package build
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n installer/install.sh installer/install-linux.sh app/scripts/*.sh scripts/ci_macos_integration.sh scripts/test_bootstrap_resilience.sh
          for f in INSTALL.command control/*.command control/linux/localtube; do /bin/sh -n "$f"; done
          python3 scripts/check_shell_compat.py
          python3 scripts/check_health_startup.py
          python3 scripts/check_loopback_transport.py
          python3 scripts/check_progress_pipeline.py
          ./scripts/test_bootstrap_resilience.sh
          python3 scripts/build_release.py >/tmp/localtube-intel-build.txt
          python3 scripts/verify_release.py
          ./INSTALL.command --layout-self-test | grep -q 'source-checkout layout self-test: OK'
      - name: Real Intel macOS runtime integration with hostile curl config
        shell: bash
        run: ./scripts/ci_macos_integration.sh
