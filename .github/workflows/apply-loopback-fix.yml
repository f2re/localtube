name: Apply sterile loopback health fix

on:
  push:
    branches:
      - fix/sterile-loopback-health-1.4.3

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: isolate loopback HTTP from curl config (1.4.3)' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_loopback_patch.py
          /bin/bash -n installer/install.sh app/scripts/*.sh scripts/ci_macos_integration.sh
          /bin/sh -n INSTALL.command control/*.command control/linux/localtube
          python3 scripts/check_loopback_transport.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app installer INSTALL.command control scripts README.md CHANGELOG.md
          git commit -m 'fix: isolate loopback HTTP from curl config (1.4.3)'
          git push origin HEAD:fix/sterile-loopback-health-1.4.3
