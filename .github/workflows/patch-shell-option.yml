name: Patch runtime shell option

on:
  push:
    branches:
      - fix/resilient-bootstrap-1.4.1

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: preserve caller shell options in runtime library' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove global set +e from sourced runtime library
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/scripts/runtime_common.sh')
          text=p.read_text(encoding='utf-8')
          old='# Bash 3.2 compatible; does not source interactive shell profiles.\nset +e\n\n'
          new='# Bash 3.2 compatible; does not source interactive shell profiles.\n# This file is sourced by installers/tests and must preserve the caller\'s shell options.\n\n'
          if old not in text:
              raise SystemExit('runtime shell-option marker not found')
          p.write_text(text.replace(old,new,1), encoding='utf-8')
          PY
          /bin/bash -n app/scripts/runtime_common.sh
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/scripts/runtime_common.sh
          git commit -m 'fix: preserve caller shell options in runtime library'
          git push origin HEAD:fix/resilient-bootstrap-1.4.1
