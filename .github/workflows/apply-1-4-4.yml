name: Apply LocalTube 1.4.4 patch

on:
  push:
    branches:
      - fix/progress-windows-installer-1.4.4

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: truthful progress and Windows installer (1.4.4)' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and static guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_1_4_4_patch.py
          /bin/bash -n installer/install.sh installer/install-linux.sh app/scripts/*.sh scripts/test_bootstrap_resilience.sh
          /bin/sh -n INSTALL.command control/*.command control/linux/localtube
          python3 scripts/check_progress_pipeline.py
          python3 scripts/check_shell_compat.py
          python3 scripts/check_health_startup.py
          python3 scripts/check_loopback_transport.py
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . ':!.github/workflows/apply-1-4-4.yml' ':!scripts/apply_1_4_4_patch.py'
          git commit -m 'fix: truthful progress and Windows installer (1.4.4)'
          git push origin HEAD:fix/progress-windows-installer-1.4.4
