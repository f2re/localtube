name: Patch download retry errexit

on:
  push:
    branches:
      - fix/resilient-bootstrap-1.4.1

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: make download retries errexit-safe' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply errexit-safe retry patch
        shell: bash
        run: |
          python3 scripts/patch_download_errexit.py
          /bin/bash -n app/scripts/runtime_common.sh
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch_download_errexit.py
          git add app/scripts/runtime_common.sh
          git commit -m 'fix: make download retries errexit-safe'
          git push origin HEAD:fix/resilient-bootstrap-1.4.1
