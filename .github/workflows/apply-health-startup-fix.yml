name: Apply health startup race fix

on:
  push:
    branches:
      - fix/health-startup-race-1.4.2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python3 scripts/apply_health_startup_patch.py
          /bin/bash -n installer/install.sh app/scripts/runtime_common.sh
          python3 scripts/check_health_startup.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/VERSION app/server.ts app/scripts/runtime_common.sh installer/install.sh scripts/test.sh scripts/check_health_startup.py CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: avoid transient runtime-ready rollback (1.4.2)'
          git push origin HEAD:fix/health-startup-race-1.4.2
