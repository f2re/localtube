name: Patch loopback preflight

on:
  push:
    branches:
      - fix/sterile-loopback-health-1.4.3

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: sterilize installer preflight loopback request' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch preflight request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('installer/install.sh')
          text=p.read_text(encoding='utf-8')
          old='_jobs="$(/usr/bin/curl --fail --silent --max-time 4 -H "X-LocalTube-Token: $_token" "http://127.0.0.1:$_port/api/jobs" 2>/dev/null)" || return 1'
          new='_jobs="$(/usr/bin/curl -q --noproxy \'*\' --http1.1 --fail --silent --max-time 4 -H "X-LocalTube-Token: $_token" "http://127.0.0.1:$_port/api/jobs" 2>/dev/null)" || return 1'
          if old not in text:
              raise SystemExit('installer active_downloads curl pattern not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          /bin/bash -n installer/install.sh
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer/install.sh
          git commit -m 'fix: sterilize installer preflight loopback request'
          git push origin HEAD:fix/sterile-loopback-health-1.4.3
