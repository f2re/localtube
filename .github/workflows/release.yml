name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global typescript@5.8.3

      - name: Audit and build all platform packages
        shell: bash
        run: ./scripts/test.sh

      - name: Real macOS integration
        shell: bash
        run: ./scripts/ci_macos_integration.sh

      - name: Build macOS DMG and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat app/VERSION)"
          PKG="dist/LocalTube-macOS-v${VERSION}"
          DMG="dist/LocalTube-macOS-v${VERSION}.dmg"
          hdiutil create -volname "LocalTube ${VERSION}" -srcfolder "$PKG" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: LocalTube-release-candidates
          path: |
            dist/LocalTube-macOS-v*.zip
            dist/LocalTube-macOS-v*.zip.sha256
            dist/LocalTube-macOS-v*.dmg
            dist/LocalTube-macOS-v*.dmg.sha256
            dist/LocalTube-Linux-v*.tar.gz
            dist/LocalTube-Linux-v*.tar.gz.sha256
            dist/LocalTube-Windows-v*.zip
            dist/LocalTube-Windows-v*.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat app/VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/LocalTube-macOS-v${VERSION}.zip" \
            "dist/LocalTube-macOS-v${VERSION}.zip.sha256" \
            "dist/LocalTube-macOS-v${VERSION}.dmg" \
            "dist/LocalTube-macOS-v${VERSION}.dmg.sha256" \
            "dist/LocalTube-Linux-v${VERSION}.tar.gz" \
            "dist/LocalTube-Linux-v${VERSION}.tar.gz.sha256" \
            "dist/LocalTube-Windows-v${VERSION}.zip" \
            "dist/LocalTube-Windows-v${VERSION}.zip.sha256" \
            --title "LocalTube ${VERSION}" --generate-notes
